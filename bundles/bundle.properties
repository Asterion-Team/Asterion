#Factions
block.as-faction-resemblance.name = Faction - [#6c87fd]«Resemblance»[]
block.as-faction-resemblance.description = Your faction, your history on this planet.
block.as-faction-orion.name = Faction - [#d0d8e8]«Orion»[]
block.as-faction-orion.description = The oldest faction after the [#fcf3cf]Precursors[], using plasma and the energy of stars as its main weapon. After the collapse of the [#fcf3cf]Precursors[], it is the most powerful faction on Asterion.
block.as-faction-pyro.name = Faction - [#c75432]«Pyro»[]
block.as-faction-pyro.description = A faction that has taken fire as its main combat principle. The face of the beginning of war.
block.as-faction-extinguished.name = Faction - [#d26e64]«The Extinguished»[]
block.as-faction-extinguished.description = A faction almost wiped off the face of Asterion. As a result of a lightning strike by two hostile factions, it was the first to be broken in the great war. Your potential ally.
block.as-faction-techno.name = Faction - [#74c1e8]«Techno»[]
block.as-faction-techno.description = The most passive, but technologically advanced faction. The very first faction to discover zero‑point energy and the principle of teleportation of small objects.

#Items
item.as-whitorite.name = Whitorite
item.as-whitorite.description = An extremely common and necessary mineral on Asterion. Involved in almost all structures.
item.as-pyrite.name = Pyrite
item.as-pyrite.description = The second most common resource, but not in necessity. Most often needed for electrical structures, however it can be used as a slowing ammunition.
item.as-quartz.name = Quartz
item.as-quartz.description = A crystalline formation based on silicon. It is not used anywhere by itself, but is often needed as a raw material for producing other resources.
item.as-irmenite.name = Irmenite
item.as-irmenite.description = A silicon formation with an unusually strong structure, making this material ideal for complex structures and piercing ammunition.
item.as-ashotite.name = Ashotite
item.as-ashotite.description = A formation based on methane and calcium obtained from ash in the atmosphere. It has an extremely high specific heat of combustion, making this resource useful for generators, demolition and fragmentation ammunition.
item.as-zincum.name = Zinc
item.as-zincum.description = Used primarily in production blocks as anti‑corrosion protection. By itself it is not strong and is easily fusible.
item.as-magnetite.name = Magnetite
item.as-magnetite.description = Used in advanced structures. Has a natural magnetic field; when used as ammunition, it causes a short‑term EMP (electromagnetic pulse) effect.
item.as-zionitium.name = Zionitium
item.as-zionitium.description = A composite based on zion. Not very strong, but very refractory and thermally conductive.
item.as-zionitium.details = Thermal conductivity is a bad trait of this material, so it should not be used in plating that will later be subjected to excessively high temperatures.
item.as-blacktite.name = Blacktite
item.as-blacktite.description = A carbon composite. Quite strong and lightweight, but not very resistant to temperature changes. Extensively used in advanced structures of any faction.

#Liquids
liquid.as-methane.name = Methane
liquid.as-methane.description = A flammable gas. Used as fuel in some generators and as a raw material for obtaining other resources.
liquid.as-kryoline.name = Kryoline
liquid.as-kryoline.description = A cold caustic liquid. Used as a stimulant in reactions for producing resources.
liquid.as-kryoline.details = After the use of some "doomsday" weapon, all seas on Asterion turned into this caustic mixture of acids and alkalis.

#Blocks
 #Blocks
block.as-core-force.name = Core: "Force"
block.as-core-force.description = Your heart of influence in every sector. When it is destroyed, your connection and influence in the sector is completely lost.
block.as-core-impact.name = Core: "Impact"
block.as-core-impact.description = Stores more items and is better protected. Similarly to the previous one – when destroyed, your connection and influence in the sector is completely lost.
block.as-core-pressure.name = Core: "Pressure"
block.as-core-pressure.description = Stores more items and is better protected. Similarly to the previous ones – when destroyed, your connection and influence in the sector is completely lost.

 #Logistics blocks
block.as-whitorite-duct.name = Whitorite Duct
block.as-whitorite-duct.description = Moves items forward.
block.as-whitorite-router.name = Whitorite Router
block.as-whitorite-router.description = Distributes items in 3 directions.
block.as-whitorite-junction.name = Whitorite Junction
block.as-whitorite-junction.description = Allows two perpendicular item flows to cross without mixing.
block.as-whitorite-duct-bridge.name = Whitorite Duct Bridge
block.as-whitorite-duct-bridge.description = Allows items to cross an impassable surface.
block.as-whitorite-sorter.name = Whitorite Sorter
block.as-whitorite-sorter.description = Passes the selected item straight, others to the sides.
block.as-whitorite-inverted-sorter.name = Whitorite Inverted Sorter
block.as-whitorite-inverted-sorter.description = Passes the selected item to the sides, others forward.
block.as-whitorite-gateway.name = Whitorite Overflow Gate
block.as-whitorite-gateway.description = Passes items forward as priority; if the forward output is blocked, passes items to the sides.
block.as-whitorite-inverted-gateway.name = Whitorite Overflow Gateway
block.as-whitorite-inverted-gateway.description = Passes items to the sides as priority; if the side outputs are blocked, passes items forward.
block.as-whitorite-container.name = Whitorite Container
block.as-whitorite-container.description = Stores items; can be unloaded by an unloader if needed. When placed next to a core, expands its storage.
block.as-whitorite-unloader.name = Whitorite Unloader
block.as-whitorite-unloader.description = Unloads items from adjacent buildings. Can distribute items between factories or unload from storage blocks and cores.
block.as-magnetite-conveyor.name = Magnetite Conveyor
block.as-magnetite-conveyor.description = Moves items in batches and unloads them in three directions at the end.

 #Liquid logistics blocks
block.as-irmenite-conduit.name = Irmenite Conduit
block.as-irmenite-conduit.description = Moves liquids forward.
block.as-irmenite-router.name = Irmenite Router
block.as-irmenite-router.description = Distributes liquid flow.
block.as-irmenite-junction.name = Irmenite Junction
block.as-irmenite-junction.description = Allows two perpendicular liquid flows to cross without mixing.
block.as-irmenite-bridge.name = Irmenite Bridge
block.as-irmenite-bridge.description = Allows liquids to cross an impassable surface.
block.as-irmenite-pump.name = Irmenite Pump
block.as-irmenite-pump.description = Just a pump. Transfers liquids.
block.as-irmenite-tank.name = Irmenite Tank
block.as-irmenite-tank.description = Stores liquids.

 #Extraction blocks
block.as-impulse-drill.name = Impulse Drill
block.as-impulse-drill.description = Drills items in batches at a constant interval.
block.as-rotary-drill.name = Rotary Drill
block.as-rotary-drill.description = Drills items in a continuous stream. Requires methane as fuel for drilling.
block.as-methane-extractor.name = Methane Extractor
block.as-methane-extractor.description = Pumps methane from vents.
block.as-methane-extractor.details = Due to the vacuum created, it extracts much more methane than the vent burner uses, so it is much more efficient to use this device together with external combustion generators.
block.as-zion-synthesizer.name = Zion Synthesizer
block.as-zion-synthesizer.description = Through electrolysis, separates zion from kryoline, using zinc as a reaction stimulant.
block.as-magnetite-deep-drill.name = Magnetite Deep Drill
block.as-magnetite-deep-drill.description = Drills magnetite from underground clusters. Requires methane and kryoline to maintain the drilling process.

 #Production blocks
block.as-irmenite-oven.name = Irmenite Oven
block.as-irmenite-oven.description = Reduces irmenite from quartz using whitorite.
block.as-irmenite-oven.details = The key to the technologies of the [#d0d8e8]Orion[] faction.
block.as-ashotite-press.name = AshotitePress
block.as-ashotite-press.description = Compresses ash from the atmosphere together with methane and quartz to produce ashotite.
block.as-blacktite-smelter.name = Blacktite Smelter
block.as-blacktite-smelter.description = Uses the electric arc principle to smelt blacktite.
block.as-zionitium-press.name = Zionitium Press
block.as-zionitium-press.description = Compresses pyrite under the influence of zion, thereby obtaining zionitium in the process.

 #Power blocks
block.as-vent-burner.name = Vent Burner
block.as-vent-burner.description = Collects and burns all methane obtained from vents, thereby generating energy.
block.as-whitorite-beam-node.name = Whitorite Beam Node
block.as-whitorite-beam-node.description = Distributes energy.
block.as-burn-generator.name = Combustion Generator
block.as-burn-generator.description = Burns methane to produce energy.
block.as-burn-generator.details = Unlike the vent burner, it uses more methane in a compact size to generate more energy.

 #Unit factories
  #Orion
block.as-orion-factory.name = Orion Factory
block.as-orion-factory.description = Creates the unit of the [#d0d8e8]«Orion»[] faction – the "Varan".
  #Pyro
block.as-pyro-factory.name = Pyro Factory
block.as-pyro-factory.description = Creates the unit of the [#c75432]«Pyro»[] faction – the "Spark".

 #Walls
block.as-whitorite-wall.name = Whitorite Wall
block.as-whitorite-wall.description = Protects buildings from enemy projectiles.
block.as-whitorite-wall-large.name = Large Whitorite Wall
block.as-whitorite-wall-large.description = Protects buildings from enemy projectiles.
block.as-irmenite-wall.name = Irmenite Wall
block.as-irmenite-wall.description = Protects buildings from enemy projectiles, blocks passing lasers.
block.as-irmenite-wall-large.name = Large Irmenite Wall
block.as-irmenite-wall-large.description = Protects buildings from enemy projectiles, blocks passing lasers.

 #Turrets
block.as-splinter.name = Splinter
block.as-splinter.description = Fires fast‑flying piercing spears.
block.as-decay.name = Decay
block.as-decay.description = Fires a slowing and piercing needle.
block.as-breakthrough.name = Breakthrough
block.as-breakthrough.description = Fires a continuously accelerating stream of heavy projectiles. After downtime, the acceleration decays over time.
block.as-ignition.name = Ignition
block.as-ignition.description = Fires a cluster of incendiary substance that acts like a thermite mixture upon hitting the enemy.
block.as-glare.name = Glare
block.as-glare.description = Releases a burning flame that melts enemies.
block.as-spark.name = Spark
block.as-spark.description = Fires a ball lightning that strikes everything in a small radius.

block.as-typhoon.name = Typhoon
block.as-typhoon.description = A large twin‑barreled turret. Fires massive high‑explosive shells. Can switch firing modes.

block.as-destroyer.name = Annihilation
block.as-destroyer.description = An ancient weapon of the [#fcf3cf]Precursors[]. Fires a pure antimatter laser capable of destroying even the [#fcf3cf]Zodiac[].

#Units
 #Orion
unit.as-varan.name = Varan
unit.as-varan.description = A simple mech of the [#d0d8e8]«Orion»[] faction. Fires small plasma bursts.
unit.as-piranha.name = Piranha
unit.as-piranha.description = A mech of the [#d0d8e8]«Orion»[] faction. Releases draining beams with a vampirism effect.
unit.as-vulture.name = Vulture
unit.as-vulture.description = A mech of the [#d0d8e8]«Orion»[] faction. Fires bursts consisting of plasma bundles.
unit.as-vulture.details = After the collapse of the Precursors, members of the Orion faction began studying samples of their combat machines. Looking at the concept of the [#fcf3cf]Zodiac[], they took the concept of an experimental core and used it as the basis for this machine. The cores of this and subsequent machines of this faction have the ability to store excess energy and release it, thereby triggering an overload process. The advanced mechanisms of these machines allow them to withstand overload, but the unit temporarily weakens in terms of durability.
unit.as-scorpion.name = Scorpion
unit.as-scorpion.description = A mech of the [#d0d8e8]«Orion»[] faction. Fires bundles of unstable plasma that break apart into smaller particles in flight.
unit.as-raptor.name = Raptor
unit.as-raptor.description = A massive mech of the [#d0d8e8]«Orion»[] faction. Fires a blob of energy that damages targets both in flight and upon detonation.

 #Pyro

 #Extinguished

 #Techno

 #Other
unit.as-attraction.name = Attraction
unit.as-attraction.description = The unit of the "Force" core. Your primary controllable unit. Maneuverable. Fires restorative energy beams.
unit.as-magnetism.name = Magnetism
unit.as-magnetism.description = The unit of the "Impact" core. Your primary controllable unit. Maneuverable. Fires bursts of small stars.
 #Precursor
unit.as-zodiac.name = Zodiac
unit.as-zodiac.description = A titanic combat unit. Fires a supernova that, upon impact, instantly forms a [#ff8f8f]black hole.[]
unit.as-zodiac.details = The peak of the Precursors' technological progress. At its core lies an experimental core that powers such a huge machine. The main side cannons are fed directly from this core, which causes them to accumulate enough energy to form a supernova – unstable, but still a star. Secondary cannons are powered by a transformer, also from this core. The core passively accumulates so much energy that the Zodiac needs to discharge it by overloading – the machine becomes much more dangerous but less survivable. Fearing that the Zodiac might be indestructible, the Precursors built a superpowerful weapon – [#fcf3cf]«Annihilation».[]

