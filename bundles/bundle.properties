 #Turret modes
turret.mode.basic = Basic mode
fire.turret.mode.basic = Basic firing mode
turret.mode.artillery = Artillery mode
turret.mode.artillery.description = The turret fires from both barrels simultaneously. Shells fly in a high‑arc trajectory.
fire.turret.mode.artillery = Artillery firing mode