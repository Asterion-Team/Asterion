planet.as-01-ascetion.name = 01 - "Ascension"
planet.as-asterion.name = Asterion

 #Sectors
sector.as-entry-point.name = Entry Point
sector.as-entry-point.description = Your landing site on this planet. Activity of the local factions is relatively low here, but there is definitely something alive.
sector.as-impact-point.name = Impact Point
sector.as-impact-point.description = An intermediate sector. You will not unlock any new technologies here, but you will encounter your future enemy for the first time.
sector.as-quartz-valley.name = Quartz Valley
sector.as-quartz-valley.description = This sector has a huge quartz content. Also, an outpost of the [#d0d8e8]Orion[] faction has been found here.
sector.as-gorge.name = Gorge
sector.as-gorge.description = This sector contains an outpost of [#c75432]Pyro.[] Explore the basic technologies of the [#d0d8e8]Orion[] faction to capture this sector.
sector.as-coast.name = Coast
sector.as-coast.description = A coastal sector next to one of the kryoline lakes. Here you will gain access to liquid extraction and storage technologies, however activity of two factions has been noticed at once, but they will land from the same point.

